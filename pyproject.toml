[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skreddata"
version = "0.1.0"
description = "Mongo-backed Python API for the skreddata database"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NORCE - The Norwegian Research Center AS" },
]
dependencies = [
    "python-dateutil",
    "shapely",
    "typer",
    "rich",
    "pymongo",
]

[project.scripts]
skreddata = "skreddata.cli.app:main"

[tool.setuptools.packages.find]
include = ["skreddata*"]
